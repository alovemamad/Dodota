name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Bump version automatically
      id: bump
      run: |
        # خواندن نسخه فعلی از build.gradle.kts
        CURRENT_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
        echo "Current version: $CURRENT_VERSION"

        # افزایش قسمت آخر نسخه (مثلاً 1.0.0 -> 1.0.1)
        MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
        MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
        PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

        # اگر run_number بزرگتر است، از آن استفاده کن (برای جلوگیری از تکرار)
        RUN_PATCH=${{ github.run_number }}
        if [ "$RUN_PATCH" -gt "$NEW_PATCH" ]; then
          NEW_PATCH=$RUN_PATCH
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
        fi

        echo "New version: $NEW_VERSION"

        # جایگزینی در فایل build.gradle.kts
        sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"$NEW_VERSION\"/" app/build.gradle.kts
        sed -i -E "s/versionCode = [0-9]+/versionCode $NEW_PATCH/" app/build.gradle.kts

        # ذخیره برای مراحل بعدی
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
        echo "NEW_PATCH=$NEW_PATCH" >> $GITHUB_ENV

    - name: Create Keystores
      run: |
        if [ ! -f my-upload-key.jks ]; then
          keytool -genkeypair -v -keystore my-upload-key.jks -storepass dodota123456 -alias upload -keypass dodota123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dodota,OU=Finance,O=DodotaApp,L=Tehran,ST=Tehran,C=IR"
        fi
        cp my-upload-key.jks app/my-upload-key.jks || true
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        cp debug.keystore app/debug.keystore || true

    - name: Build with Gradle (Release & Debug)
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: dodota123456
        KEY_PASSWORD: dodota123456
      run: gradle assembleRelease assembleDebug

    - name: Upload Release APK (Recommended for Phone Installation)
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release and Upload APK
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.NEW_VERSION }}
        name: Release v${{ env.NEW_VERSION }}
        files: app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
