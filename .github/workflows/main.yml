name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Create Keystores
      run: |
        if [ ! -f my-upload-key.jks ]; then
          keytool -genkeypair -v -keystore my-upload-key.jks -storepass dodota123456 -alias upload -keypass dodota123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dodota,OU=Finance,O=DodotaApp,L=Tehran,ST=Tehran,C=IR"
        fi
        cp my-upload-key.jks app/my-upload-key.jks || true
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        cp debug.keystore app/debug.keystore || true
    - name: Build with Gradle (Release & Debug)
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: dodota123456
        KEY_PASSWORD: dodota123456
      run: gradle assembleRelease assembleDebug
    - name: Upload Release APK (Recommended for Phone Installation)
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
